name: Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например 1.0.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Enforce Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
            tag="${GITHUB_REF_NAME}"
          else
            name="${INPUT_VERSION#v}"
            tag="v${name}"
          fi

          if ! echo "$name" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$name'. Use a value like 1.0.1 or 1.0.1-rc1."
            exit 1
          fi

          numeric="${name%%-*}"
          IFS='.' read -r major minor patch <<< "$numeric"
          major="${major:-0}"
          minor="${minor:-0}"
          patch="${patch:-0}"

          code=$(( major * 10000 + minor * 100 + patch ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release: $tag, version $name ($code)"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/carts-release.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: keystore/carts-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}
          --no-daemon --console=plain

      - name: Verify APK signature
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "APK: $apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"

      - name: Prepare artifact
        id: artifact
        run: |
          mkdir -p dist
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          dest="dist/carts-${{ steps.version.outputs.name }}.apk"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: carts-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK_PATH: ${{ steps.artifact.outputs.path }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --title "Carts $VERSION_NAME" \
              --generate-notes \
              --verify-tag
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --title "Carts $VERSION_NAME" \
              --generate-notes \
              --target "$TARGET_SHA"
          fi
